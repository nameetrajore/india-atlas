- { id: jahangir, name: Jahangir, tier: 2, born: "1569-08-31", died: "1627-10-28", role: Mughal emperor (1605–1627), summary: "Akbar's son. He received the English as one more group of foreign merchants and treated their gifts with polite amusement.", sources: [wp-jahangir] }
- { id: thomas-roe, name: Sir Thomas Roe, tier: 2, role: "James I's ambassador to the Mughal court (1615–1619)", summary: "Spent three years at Jahangir's court seeking a trade treaty. He came away with permissions, not a treaty, and advised the Company to seek profit through trade, not war.", sources: [wp-thomas-roe] }
- { id: aurangzeb, name: Aurangzeb, tier: 2, born: "1618-11-03", died: "1707-03-03", role: Mughal emperor (1658–1707), summary: "Pushed the empire to its widest extent and spent his last 25 years fighting the Marathas in the Deccan. He crushed the Company's attempt at war in 1686–90.", sources: [wp-aurangzeb] }
- { id: josiah-child, name: Sir Josiah Child, tier: 2, role: Governor of the East India Company, summary: "The Company's dominant figure in London in the 1680s. He believed it should hold fortified territory and make war like the Dutch, and his war with the Mughals ended in humiliation.", sources: [wp-childs-war] }
- { id: job-charnock, name: Job Charnock, tier: 2, died: "1693-01-10", role: Company agent in Bengal, summary: "A veteran Bengal trader who in 1690 chose a marshy riverbank site at Sutanuti for the Company's new base. It became Calcutta.", sources: [wp-job-charnock] }
- { id: shivaji, name: Shivaji, tier: 2, born: "1630-02-19", died: "1680-04-03", role: Founder of the Maratha kingdom, summary: "Carved out a Maratha state against the Mughals and Bijapur. His raids on Surat in 1664 and 1670 showed the Company that Mughal protection was not enough.", sources: [wp-sack-of-surat] }
