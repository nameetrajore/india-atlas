# People introduced in chapters 2–4 (Tier 2: shown at their events).
- { id: farrukhsiyar, name: Farrukhsiyar, tier: 2, died: "1719-04", role: Mughal emperor (1713–1719), summary: "A weak emperor controlled by the Sayyid brothers. His 1717 farman gave the Company duty-free trade in Bengal.", sources: [wp-farrukhsiyar] }
- { id: nadir-shah, name: Nadir Shah, tier: 2, died: "1747-06-19", role: Shah of Persia, summary: "A soldier-king who invaded India in 1739, routed the Mughal army at Karnal and sacked Delhi. He carried off the Peacock Throne and the Koh-i-Noor.", sources: [wp-nadir-shah-india] }
- { id: asaf-jah, name: "Asaf Jah I (Nizam-ul-Mulk)", tier: 2, died: "1748-06-01", role: First Nizam of Hyderabad, summary: "A senior Mughal noble who made the Deccan his own state after 1724, while still claiming loyalty to Delhi. That was the model for every successor state.", sources: [wp-asaf-jah] }
- { id: baji-rao-i, name: Baji Rao I, tier: 2, died: "1740-04-28", role: Maratha Peshwa (1720–1740), summary: "A brilliant cavalry general who carried Maratha power north into Malwa and Gujarat and raided the outskirts of Delhi in 1737.", sources: [wp-baji-rao-i] }
- { id: dupleix, name: Joseph-François Dupleix, tier: 2, role: Governor of French India (1742–1754), summary: "Showed that a European company could win Indian wars with small, drilled sepoy armies and rule through a friendly nawab. The British copied the method and beat him with it.", sources: [wp-dupleix] }
- { id: haidar-ali, name: Haidar Ali, tier: 2, died: "1782-12-07", role: Ruler of Mysore (1761–1782), summary: "A soldier of humble origins who took power in Mysore and built a modern army with French help. He twice brought the Company close to defeat.", sources: [wp-haidar-ali] }
- id: tipu-sultan
  name: Tipu Sultan
  tier: 2
  born: "1750-11-20"
  died: "1799-05-04"
  role: Sultan of Mysore (1782–1799)
  summary: >-
    Haidar Ali's son. He modernised Mysore's army and economy, sought French alliance, and fought the
    Company in four wars until he died defending Seringapatam.
  perspectives:
    - view: British accounts
      text: '"Citizen Tipu", a fanatic tyrant and France''s ally, whose defeat removed the last great threat in the south.'
    - view: Nationalist memory
      text: The "Tiger of Mysore", a moderniser who died fighting colonial rule.
    - view: Regional critics
      text: Remembered in parts of Coorg and Malabar for forced conversions and deportations. His record is still fought over today.
  sources: [wp-tipu, wp-anglo-mysore]
- { id: warren-hastings, name: Warren Hastings, tier: 2, born: "1732-12-06", died: "1818-08-22", role: "Governor of Bengal (1772), first Governor-General (1774–1785)", summary: "Built the Company's administration in Bengal and saved its position in the wars of the 1780s. He was impeached in London for corruption and abuse of power, and acquitted after seven years.", sources: [wp-warren-hastings, wp-hastings-impeachment] }
- { id: cornwallis, name: Lord Cornwallis, tier: 2, role: Governor-General (1786–1793), summary: "Came to India after losing America. He defeated Tipu in 1792 and fixed Bengal's land revenue forever in the Permanent Settlement.", sources: [wp-cornwallis] }
- { id: richard-wellesley, name: Richard Wellesley, tier: 2, role: Governor-General (1798–1805), summary: "An aggressive imperialist who used fear of Napoleon to justify war on Mysore and the Marathas, and the subsidiary alliance to reduce allies to dependents.", sources: [wp-richard-wellesley] }
- { id: arthur-wellesley, name: Arthur Wellesley, tier: 2, role: "British Army general in India, later Duke of Wellington", summary: "Richard Wellesley's younger brother. He won his first great victory at Assaye in 1803, twelve years before Waterloo.", sources: [wp-assaye] }
- { id: baji-rao-ii, name: Baji Rao II, tier: 2, died: "1851-01-28", role: Last Peshwa (1795–1818), summary: "Accepted British protection at Bassein in 1802, rebelled in 1817 and surrendered in 1818. He lived out his life as a pensioner at Bithur near Cawnpore, where his adopted son Nana Sahib grew up.", sources: [wp-baji-rao-ii] }
- { id: edmund-burke, name: Edmund Burke, tier: 2, role: Member of Parliament, summary: "Led the impeachment of Warren Hastings, arguing that the Company's rule in India was a crime against the people it governed.", sources: [wp-hastings-impeachment] }
