id: siraj-ud-daulah
name: Siraj-ud-Daulah
tier: 1
born: "1733"
died: "1757-07-02"
role: Nawab of Bengal, 1756–1757
summary: >-
  The last independent Nawab of Bengal. He moved quickly against the Company's unauthorised
  fortification of Calcutta, but he alienated the bankers and nobles at his own court. They then
  conspired with Clive.
perspectives:
  - view: Colonial accounts
    text: >-
      Portrayed as a cruel and reckless young tyrant, an image built largely on Holwell's Black Hole
      narrative.
  - view: Bengali and nationalist memory
    text: >-
      A patriot who defended Bengal's sovereignty and was betrayed by Mir Jafar. "Mir Jafar" became a
      byword for traitor.
  - view: Recent scholarship
    text: >-
      An inexperienced ruler with real grievances against the Company, undone by a court coalition of
      bankers and generals who wanted him gone.
sources: [wp-siraj, marshall-bengal]
itinerary:
  - { date: "1750", place: patna, approx: true, note: "Rebels against his grandfather Alivardi and seizes Patna, then submits and is forgiven." }
  - { date: "1752-05", place: murshidabad, approx: true, note: "Named heir by Alivardi, which turns rival relatives against him." }
  - { date: "1753-05", place: murshidabad, approx: true }
  - { date: "1754-05", place: murshidabad, approx: true }
  - { date: "1755-05", place: murshidabad, approx: true }
  - { date: "1756-04-10", place: murshidabad, note: "Becomes Nawab of Bengal, aged about 23, when Alivardi dies." }
  - { date: "1756-06-04", place: kasimbazar, approx: true, note: "Seizes the English factory after Calcutta refuses to stop fortifying." }
  - { date: "1756-06-20", place: calcutta, note: "Takes Fort William; captives die that night in the 'Black Hole'." }
  - { date: "1756-07", place: murshidabad, approx: true }
  - { date: "1756-10-16", place: manihari, note: "Defeats and kills his cousin Shaukat Jang, the rival claimant from Purnea." }
  - { date: "1756-11", place: murshidabad, approx: true }
  - { date: "1757-02-05", place: calcutta, note: "Clive attacks his camp outside Calcutta at dawn; both sides lose heavily." }
  - { date: "1757-02-09", place: calcutta, note: "Signs the Treaty of Alinagar, giving back the Company's trade rights." }
  - { date: "1757-04", place: murshidabad, approx: true }
  - { date: "1757-06-04", place: murshidabad, approx: true, note: "His general Mir Jafar and the Jagat Seth bankers secretly agree terms with Clive." }
  - { date: "1757-06-23", place: plassey, note: "Loses at Plassey when Mir Jafar's troops stand aside." }
  - { date: "1757-06-24", place: murshidabad, note: "Flees to his capital, then slips away upriver by night." }
  - { date: "1757-07-01", coords: [87.835, 25.05], approx: true, note: "Captured near Rajmahal while trying to reach his French allies." }
  - { date: "1757-07-02", place: murshidabad, note: "Killed in Murshidabad on the orders of Mir Jafar's son Miran." }
