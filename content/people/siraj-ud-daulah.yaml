id: siraj-ud-daulah
name: Siraj-ud-Daulah
tier: 1
born: "1733"
died: "1757-07-02"
role: Nawab of Bengal, 1756–1757
summary: >-
  The last independent Nawab of Bengal. He moved quickly against the Company's unauthorised
  fortification of Calcutta, but he alienated the bankers and nobles at his own court. They then
  conspired with Clive.
perspectives:
  - view: Colonial accounts
    text: >-
      Portrayed as a cruel and reckless young tyrant, an image built largely on Holwell's Black Hole
      narrative.
  - view: Bengali and nationalist memory
    text: >-
      A patriot who defended Bengal's sovereignty and was betrayed by Mir Jafar. "Mir Jafar" became a
      byword for traitor.
  - view: Recent scholarship
    text: >-
      An inexperienced ruler with real grievances against the Company, undone by a court coalition of
      bankers and generals who wanted him gone.
sources: [wp-siraj, marshall-bengal]
itinerary:
