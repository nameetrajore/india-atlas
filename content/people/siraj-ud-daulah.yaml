  - { date: "1756-07", place: murshidabad, approx: true }
  - { date: "1756-10", place: manihari, note: Defeats Shaukat Jang }
  - { date: "1756-11", place: murshidabad, approx: true }
  - { date: "1757-02-05", place: calcutta, note: Clash with Clive outside Calcutta }
  - { date: "1757-02-09", place: calcutta, note: Treaty of Alinagar }
  - { date: "1757-03", place: murshidabad, approx: true }
  - { date: "1757-06-23", place: plassey, note: Battle of Plassey }
  - { date: "1757-06-24", place: murshidabad, note: Flees to his capital }
  - { date: "1757-07-02", place: murshidabad, note: Executed }
