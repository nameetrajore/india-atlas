# Tier-2 people for chapters 8–10.
- { id: gokhale, name: Gopal Krishna Gokhale, tier: 2, died: "1915-02-19", role: Moderate Congress leader, summary: "Believed in constitutional reform and petitioning. Gandhi called him his political guru.", sources: [wp-gokhale] }
- { id: khudiram-bose, name: Khudiram Bose, tier: 2, born: "1889-12-03", died: "1908-08-11", role: Bengal revolutionary, summary: "Hanged at 18 for the Muzaffarpur bombing, which killed two Englishwomen by mistake. Bengali folk songs made him a martyr.", sources: [wp-khudiram] }
- { id: tagore, name: Rabindranath Tagore, tier: 2, born: "1861-05-07", died: "1941-08-07", role: Poet; Nobel laureate (1913), summary: "Wrote songs for the Swadeshi movement and renounced his knighthood after Jallianwala Bagh. He also criticised narrow nationalism.", sources: [wp-tagore] }
- { id: dyer, name: Reginald Dyer, tier: 2, role: British Army brigadier-general, summary: "Ordered the firing at Jallianwala Bagh. He was censured and retired, but celebrated by many in Britain, where a public fund raised about £26,000 for him.", sources: [wp-dyer] }
- { id: montagu, name: Edwin Montagu, tier: 2, role: "Secretary of State for India (1917–1922)", summary: "Announced in 1917 that Britain's goal was 'responsible government' in India, and co-wrote the 1919 reforms.", sources: [wp-montagu-chelmsford] }
- { id: muhammad-ali-jauhar, name: Muhammad Ali Jauhar, tier: 2, role: Khilafat leader, summary: "With his brother Shaukat Ali he led the Khilafat movement and allied it with Gandhi's non-cooperation.", sources: [wp-khilafat] }
- { id: irwin, name: Lord Irwin, tier: 2, role: "Viceroy of India (1926–1931)", summary: "Promised dominion status as the 'natural issue' of India's progress (1929) and negotiated the 1931 pact with Gandhi.", sources: [wp-gandhi-irwin] }
- { id: iqbal, name: Muhammad Iqbal, tier: 2, died: "1938-04-21", role: Poet and philosopher, summary: "In 1930, at Allahabad, he called for a consolidated Muslim state in north-western India within or outside the empire.", sources: [wp-iqbal] }
- { id: linlithgow, name: Lord Linlithgow, tier: 2, role: "Viceroy of India (1936–1943)", summary: "Declared India at war in September 1939 without consulting any Indian leader, and crushed Quit India.", sources: [wp-linlithgow] }
- { id: cripps, name: Sir Stafford Cripps, tier: 2, role: British Labour minister, summary: "Brought the 1942 offer of post-war dominion status, with the right of provinces to opt out. It was rejected by both Congress and the League.", sources: [wp-cripps] }
- { id: churchill, name: Winston Churchill, tier: 2, role: "British Prime Minister (1940–1945)", summary: "A lifelong opponent of Indian self-government. His war cabinet's handling of food shipments during the Bengal famine remains bitterly debated.", sources: [mukerjee-churchill, wp-bengal-famine] }
- { id: azad, name: Maulana Abul Kalam Azad, tier: 2, role: Congress president (1940–1946), summary: "A Muslim scholar who opposed Partition and led the Congress through the war years and the Cabinet Mission talks.", sources: [wp-azad] }
- { id: suhrawardy, name: H. S. Suhrawardy, tier: 2, role: "Premier of Bengal (1946–1947)", summary: "Muslim League chief minister of Bengal during the Great Calcutta Killings. His role is contested; he later worked with Gandhi for peace in Calcutta.", sources: [wp-suhrawardy, wp-direct-action] }
- { id: mountbatten, name: Lord Mountbatten, tier: 2, role: "Last Viceroy (1947)", summary: "Sent to hand over power by June 1948, he brought the date forward to 15 August 1947.", sources: [wp-mountbatten] }
- { id: radcliffe, name: Sir Cyril Radcliffe, tier: 2, role: Chairman of the boundary commissions, summary: "A lawyer who had never been to India. He drew the Punjab and Bengal borders in about five weeks.", sources: [wp-radcliffe-line] }
