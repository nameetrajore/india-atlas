id: gandhi
name: M. K. Gandhi
tier: 1
born: "1869-10-02"
died: "1948-01-30"
role: Leader of the national movement
summary: >-
  A lawyer from Porbandar who developed satyagraha (non-violent resistance) in South Africa. From
  1919 he turned the Congress into a mass movement through non-cooperation, the Salt March and Quit
  India. He was assassinated in January 1948.
perspectives:
  - view: Nationalist historiography
    text: The "Father of the Nation", whose non-violent mass politics broke the moral authority of the Raj.
  - view: Ambedkarite and Dalit critique
    text: >-
      A defender of the caste order in reformed form. His Poona fast forced Ambedkar to give up separate
      electorates.
  - view: Left and subaltern historiography
    text: >-
      He mobilised peasants but kept movements within limits acceptable to Indian propertied classes. He
      called off struggles, as after Chauri Chaura, when they went beyond his control.
sources: [wp-gandhi, chandra-struggle, sarkar-modern, guha-gandhi]
# Repeated stops at one place with no note mean "still here" (e.g. prison terms), so the marker does not fade.
