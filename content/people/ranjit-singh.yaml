id: ranjit-singh
name: Maharaja Ranjit Singh
tier: 1
born: "1780-11-13"
died: "1839-06-27"
role: Founder of the Sikh Empire
summary: >-
  United the Punjab under a single kingdom with a modern army. While he lived, the British treated him
  as an equal.
sources: [wp-ranjit-singh, khushwant-ranjit]
