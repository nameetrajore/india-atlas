# Tier-2 people for chapters 5–7 (shown at their events).
- { id: bentinck, name: Lord William Bentinck, tier: 2, role: "Governor-General (1828–1835)", summary: "A reforming Governor-General. He banned sati, cut costs, and backed English-language education.", sources: [wp-bentinck] }
- { id: rammohun-roy, name: Rammohun Roy, tier: 2, born: "1772-05-22", died: "1833-09-27", role: Reformer and writer, summary: "A Bengali scholar who campaigned against sati and argued for modern education. He is often called the father of the Bengal Renaissance.", sources: [wp-rammohun-roy] }
- { id: macaulay, name: Thomas Babington Macaulay, tier: 2, role: "Law member of the Governor-General's council (1834–1838)", summary: "Wrote the 1835 Minute on Education, which argued for teaching in English. He also drafted the Indian Penal Code.", sources: [wp-macaulay] }
- { id: ranjit-singh, name: Maharaja Ranjit Singh, tier: 2, born: "1780-11-13", died: "1839-06-27", role: Founder of the Sikh Empire, summary: "United the Punjab under a single kingdom with a modern army. While he lived, the British treated him as an equal.", sources: [wp-ranjit-singh] }
- { id: dalhousie, name: Lord Dalhousie, tier: 2, role: "Governor-General (1848–1856)", summary: "Annexed Punjab, Pegu, the lapsed states and Awadh. He also launched railways, the telegraph and a postal service. His annexations are counted among the causes of 1857.", sources: [wp-dalhousie] }
- { id: wajid-ali-shah, name: Wajid Ali Shah, tier: 2, born: "1822-07-30", died: "1887-09-01", role: Last Nawab of Awadh, summary: "A poet and patron of music and dance, deposed when the Company annexed Awadh in 1856. He lived out his life in exile near Calcutta.", sources: [wp-wajid-ali-shah] }
- { id: tatya-tope, name: Tatya Tope, tier: 2, died: "1859-04-18", role: Rebel commander, summary: "Nana Sahib's general. He fought alongside Lakshmibai at Kalpi and Gwalior, kept up a guerrilla war for months, and was betrayed and hanged in 1859.", sources: [wp-tatya-tope] }
- { id: canning, name: Lord Canning, tier: 2, role: "Governor-General, then first Viceroy (1856–1862)", summary: "Governor-General during the revolt. His insistence on restraint in punishment earned him the mocking name 'Clemency Canning'. He read the Queen's proclamation at Allahabad.", sources: [wp-canning] }
- { id: dadabhai-naoroji, name: Dadabhai Naoroji, tier: 2, born: "1825-09-04", died: "1917-06-30", role: Economist and Congress founder, summary: "The 'Grand Old Man of India'. He argued that British rule drained India's wealth, and in 1892 he became the first Indian elected to the British Parliament.", sources: [wp-naoroji] }
- { id: lytton, name: Lord Lytton, tier: 2, role: "Viceroy (1876–1880)", summary: "Staged the 1877 Delhi Durbar during a famine, limited relief spending, and restricted the Indian-language press.", sources: [wp-lytton] }
- { id: ripon, name: Lord Ripon, tier: 2, role: "Viceroy (1880–1884)", summary: "A Liberal viceroy who introduced local self-government. His Ilbert Bill provoked a European backlash.", sources: [wp-ripon] }
- { id: thibaw, name: King Thibaw, tier: 2, born: "1859-01-01", died: "1916-12-19", role: Last king of Burma, summary: "Deposed in 1885 and exiled to Ratnagiri in India, where he died.", sources: [wp-thibaw] }
- { id: curzon, name: Lord Curzon, tier: 2, role: "Viceroy (1899–1905)", summary: "An energetic, arrogant viceroy. He created the North-West Frontier Province, restored monuments, and partitioned Bengal.", sources: [wp-curzon] }
