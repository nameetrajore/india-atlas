- id: independence
  name: Independence and Partition
  date: 1947-08-15
  place: delhi
  kind: political
  significance: 5
  participants:
    - nehru
    - jinnah
    - gandhi
  summary: India and Pakistan become independent dominions. Nehru speaks of a "tryst with destiny". Gandhi is in
    Calcutta, fasting against the violence. The Radcliffe boundaries are published on 17 August.
  why: The end of the Raj, and one of the largest forced migrations in history.
  figures:
    - label: Deaths in Partition violence
      min: 200000
      max: 2000000
      note: Estimates vary by an order of magnitude.
