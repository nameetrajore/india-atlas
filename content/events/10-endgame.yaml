- id: bengal-famine
  name: Bengal famine of 1943
  date: "1943"
  end: "1944"
  place: calcutta
  kind: famine
  significance: 5
  summary: Wartime policy, the loss of Burmese rice, hoarding and administrative failure produce famine in Bengal.
  why: The share of blame between wartime policy and other causes is still argued over.
  figures:
    - label: Deaths
      min: 2100000
      max: 3000000
      note: Estimates range from about 2.1 million to about 3 million.
