- id: cloth-europe
  name: "Indian cloth to Europe"
  goods: "Cotton cloth: calico, chintz and muslin"
  flow: export
  from: "1640"
  to: "1800"
  path: [[80.3, 13.1], [80.6, 13.0], [81.5, 10.5], [82.4, 8.0], [81.7, 5.4], [78.5, 3.5], [74.5, -1.5], [70.0, -4.0], [63.0, -8.0]]
  beyond: "London via the Cape"
  summary: "Company ships carried Indian cotton cloth from Madras, Bengal and Surat round the Cape to London."
  context: "Indian weavers made light, washable, brightly printed cloth that no European workshop could match. Europe had little that India wanted, so the Company paid mostly in silver."
  consequences: "Cheap calico became a fashion in England, and English weavers rioted against it. Parliament banned printed Indian cloth with the Calico Acts of 1700 and 1721."
