  beyond: "Liverpool via Suez"
  summary: "After the Suez Canal opened in 1869, steamers took Bombay cotton to Europe in weeks, not months."
  context: "The canal and the new railways to the cotton districts made Bombay one of the great cotton ports. From the 1890s much of its cotton also went east to the mills of Japan."
