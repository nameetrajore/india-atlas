- id: cotton-cape
  name: "Raw cotton from Bombay (via the Cape)"
  goods: "Raw cotton"
  flow: export
  from: "1833"
  to: "1869-11"
  path: [[72.84, 18.93], [72.7, 18.8], [71.5, 16.0], [70.0, 11.5], [68.0, 6.0], [62.5, -1.0], [56.0, -8.0]]
  beyond: "Liverpool via the Cape"
  summary: "Bombay shipped raw cotton from Gujarat and the Deccan round the Cape to the mills of Lancashire."
  context: "Lancashire mills wanted cheap raw cotton, and Indian cotton was a reserve supply beside American cotton. When the American Civil War cut supplies in 1861–65, Indian cotton prices and exports soared."
  consequences: "Bombay merchants grew rich in the boom and crashed when it ended in 1865. India now sent out raw cotton and bought back cloth made from it."
  sources: [wp-cotton-famine, dutt-economic-history]
- id: cotton-suez
