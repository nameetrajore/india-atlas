- date: "1858-02"
  certainty: confident
  note: After its recapture, Delhi is moved from the North-Western Provinces to Punjab as punishment.
  sources: [wp-delhi-province, wp-punjab-province]
  changes:
    punjab: [delhi--delhi]
- date: "1861-11-02"
  certainty: approximate
  note: Nagpur Province and the Saugor and Nerbudda Territories are merged into the new Central Provinces.
  sources: [wp-cp]
  changes:
    central-provinces:
      - division:Central_Province_and_Berar|british -central-province-and-berar--akola
        -central-province-and-berar--amraoti -central-province-and-berar--buldana
        -central-province-and-berar--yeotmal
- date: "1862"
  certainty: approximate
  note: Sambalpur is transferred from Bengal to the Central Provinces.
  sources: [wp-cp]
  changes:
    central-provinces: [orissa--sambalpur]
- date: "1874-02-06"
  certainty: approximate
  note: >-
    Assam is separated from Bengal as a chief commissionership. Sylhet, a Bengali-speaking district, is
    attached to it, a decision that shaped the 1947 referendum.
  sources: [wp-assam-province]
  changes:
    assam:
      - division:BGD:Sylhet assam--sylhet
      - assam--goalpara assam--kamrup assam--darrang assam--nowgong assam--sibsagar assam--lakhimpur
      - assam--cachar assam--khasi-and-jaintia-hills assam--naga-hills assam--garo-hills
- date: "1877-02"
  certainty: confident
  note: Oudh is merged with the North-Western Provinces under a single lieutenant-governor.
  sources: [wp-nwp, wp-up]
  changes:
    up:
      - united-province--lucknow united-province--unao united-province--rae-bareli
      - united-province--sitapur united-province--hardoi united-province--kheri
      - united-province--fyzabad united-province--gonda united-province--bahraich
      - united-province--sultanpur united-province--partabgarh united-province--bara-banki
- date: "1879-05-26"
  certainty: approximate
  note: >-
    In the Treaty of Gandamak, during the Second Anglo-Afghan War, Afghanistan cedes Pishin and Sibi.
  sources: [wp-gandamak, wp-baluchistan]
  changes:
    baluchistan: [pak--pishin, pak--qilla-abdullah, pak--sibi, pak--ziarat]
- date: "1881-03-25"
  certainty: confident
  note: The "rendition" of Mysore. After fifty years of British administration, Mysore is returned to its Wodeyar ruler.
  sources: [wp-mysore-rendition]
  changes:
    mysore-state: [division:Mysore]
- date: "1886-01-01"
  certainty: approximate
  note: >-
    After the Third Anglo-Burmese War, Upper Burma is annexed. King Thibaw is exiled to Ratnagiri in
    India.
  sources: [wp-third-burmese-war, wp-british-burma]
  changes:
    burma: [mmr--mandalay, mmr--saigang, mmr--magway, mmr--chin, mmr--kachin, mmr--kayah]
- date: "1887-11"
  certainty: approximate
  note: >-
    British Baluchistan is constituted. Quetta, leased from the Khan of Kalat since 1876, becomes its
    seat.
  sources: [wp-baluchistan, wp-kalat]
  changes:
    baluchistan: [pak--quetta]
- date: "1890"
  certainty: approximate
  note: The Zhob and Loralai tribal country is brought under the Baluchistan Agency.
  sources: [wp-baluchistan]
  changes:
    baluchistan: [pak--zhob, pak--loralai, pak--musakhel, pak--qilla-saifullah, pak--barkhan]
- date: "1899"
  certainty: approximate
  note: Chagai and Nushki are leased from Kalat for the railway towards Persia.
  sources: [wp-baluchistan]
  changes:
    baluchistan: [pak--chagai, pak--nushki]
- date: "1901-11-09"
  certainty: confident
  note: >-
    Curzon separates the North-West Frontier Province from Punjab to manage the Afghan border directly.
  sources: [wp-nwfp]
  changes:
    nwfp:
      - pak--peshawar pak--kohat pak--bannu pak--dera-ismail-khan pak--abbottabad pak--mansehra
      - pak--haripur pak--mardan pak--charsadda pak--nowshera pak--swabi pak--karak
      - pak--lakki-marwat pak--tank pak--hangu
- date: "1903-10"
  certainty: approximate
  note: Berar, leased in perpetuity from the Nizam in 1902, is attached to the Central Provinces.
  sources: [wp-berar]
  changes:
    central-provinces:
      - central-province-and-berar--akola central-province-and-berar--amraoti
      - central-province-and-berar--buldana central-province-and-berar--yeotmal
- date: "1905-10-16"
  certainty: approximate
  note: >-
    Curzon's partition of Bengal. Eastern Bengal and Assam is formed with its capital at Dacca. Western
    Bengal keeps Bihar and Orissa, and gains Sambalpur.
  sources: [wp-partition-bengal-1905, wp-ebna]
  changes:
    eastern-bengal-assam:
      - division:BGD:Barisal division:BGD:Chittagong division:BGD:Dhaka division:BGD:Khulna
      - division:BGD:Mymensingh division:BGD:Noakhali division:BGD:Rajshani division:BGD:Rangpur
      - division:BGD:Sylhet assam--sylhet bengal--malda bengal--dinajpur bengal--jalpaiguri
      - assam--goalpara assam--kamrup assam--darrang assam--nowgong assam--sibsagar assam--lakhimpur
      - assam--cachar assam--khasi-and-jaintia-hills assam--naga-hills assam--garo-hills
    bengal-presidency: [orissa--sambalpur]
- date: "1912-04-01"
  certainty: approximate
  note: >-
    The partition is annulled, as announced at the Delhi Durbar of December 1911. Bengal is reunited;
    Bihar and Orissa becomes a new province; Assam is restored; and Delhi becomes the new capital as
    its own province.
  sources: [wp-partition-bengal-1905, wp-bihar-orissa, wp-delhi-province]
  changes:
    bengal-presidency:
      - division:BGD:Barisal division:BGD:Chittagong division:BGD:Dhaka division:BGD:Khulna
      - division:BGD:Mymensingh division:BGD:Noakhali division:BGD:Rajshani division:BGD:Rangpur
      - bengal--malda bengal--dinajpur bengal--jalpaiguri
    assam:
      - division:BGD:Sylhet assam--sylhet
      - assam--goalpara assam--kamrup assam--darrang assam--nowgong assam--sibsagar assam--lakhimpur
      - assam--cachar assam--khasi-and-jaintia-hills assam--naga-hills assam--garo-hills
    bihar: [division:Bihar, orissa--balasore, orissa--cuttack, orissa--puri, orissa--sambalpur]
    delhi: [delhi--delhi]
- date: "1936-04-01"
  certainty: confident
  note: >-
    Two new provinces. Orissa is formed on linguistic lines, and Sind is separated from Bombay.
  sources: [wp-orissa-province, wp-sind-province]
  changes:
    orissa: [orissa--balasore, orissa--cuttack, orissa--puri, orissa--sambalpur, orissa--ganjam, orissa--koraput]
    sind: [division:PAK:Sindh -pak--khairpur]
- date: "1947-08-15"
  certainty: approximate
  note: >-
    Independence and Partition. The British provinces are divided between the Dominions of India and
    Pakistan; Punjab and Bengal are split along the Radcliffe Line, and Sylhet joins East Bengal by
    referendum. Princely states are shown as they stood: most had acceded to India, some to Pakistan,
    while Hyderabad, Junagadh and Kashmir were still in dispute. Borders here follow the present-day
    boundary, which closely tracks the Radcliffe Line.
  sources: [wp-partition-1947, wp-indian-independence-act]
