- date: "1819"
  certainty: approximate
  note: Ranjit Singh takes Kashmir from the Afghans.
  sources: [bose-jalal]
  changes:
    sikh-empire: [division:Jammu_and_kashmir]
- date: "1826-02"
  certainty: confident
  note: Treaty of Yandabo after the First Anglo-Burmese War. Assam, Arakan and Tenasserim are ceded.
  sources: [isd-provinces]
  changes:
    eic: [assam--darrang, assam--kamrup, assam--lakhimpur, assam--nowgong, assam--sibsagar, mmr--rakhine, mmr--tanitharyi]
