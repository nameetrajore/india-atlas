        -central-province-and-berar--yeotmal
- date: "1862"
  certainty: approximate
  note: Sambalpur is transferred from Bengal to the Central Provinces.
  sources: [wp-cp]
  changes:
    central-provinces: [orissa--sambalpur]
- date: "1874-02-06"
  certainty: approximate
  note: >-
    Assam is separated from Bengal as a chief commissionership. Sylhet, a Bengali-speaking district, is
    attached to it, a decision that shaped the 1947 referendum.
  sources: [wp-assam-province]
