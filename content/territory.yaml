# British Raj territory, 1857–1947, as sets of base units (D6, D24).
# Selectors: unit id | division:<Division>[|british|princely|proxy] | -<unit id> to remove. Spaces in a
# division name are written as "_".
# Units outside present-day India are present-day district proxies (geoboundaries), so borders there
# are approximate.
# ---- Before the Crown: Company expansion, 1600–1857 (D25). Company gains follow the CC0 table
# isd-provinces (acquisition date and mode per region). Land not assigned is "Indian rulers" on the simple map.
- date: "1600"
  certainty: approximate
  note: >-
    The year the East India Company is chartered in London. Akbar's Mughal Empire rules the north from
    Kabul to Bengal. The Deccan sultanates and southern kingdoms lie beyond it. There is no English
    presence in India yet; the Portuguese hold Goa.
  sources: [schwartzberg, wp-mughal]
  assign:
    mughal:
      - division:United_Province division:Bihar division:Bengal orissa--balasore orissa--cuttack orissa--puri
      - division:BGD:Barisal division:BGD:Dhaka division:BGD:Khulna division:BGD:Mymensingh division:BGD:Noakhali division:BGD:Rajshani division:BGD:Rangpur division:BGD:Sylhet
      - division:Punjab himachal--shimla delhi--delhi division:PAK:Punjab division:PAK:Sindh division:PAK:Islamabad_Capital_Territory
      - pak--peshawar pak--kohat pak--mardan pak--charsadda pak--nowshera pak--swabi pak--abbottabad pak--haripur
      - division:Rajputana_Agency division:Gwalior division:Central_India_Agency almer-marwara--ajmer-merwara
      - division:Western_India_State_Agency division:Rann_of_Kutch division:Baroda
      - bombay--ahmedabad bombay--kaira bombay--broach-and-panch-mahals bombay--surat
      - division:Jammu_and_kashmir bombay--east-khandesh bombay--west-khandesh
      - central-province-and-berar--akola central-province-and-berar--amraoti central-province-and-berar--buldana central-province-and-berar--yeotmal
    portuguese: [goa--goa, daman--daman, daman--daman-2]
- date: "1639"
  certainty: confident
  note: The Company gets land at Madras from a local Nayaka ruler and builds Fort St George.
  sources: [wp-fort-st-george, isd-provinces]
  changes:
    eic: [madras--madras]
- date: "1668"
  certainty: approximate
  note: >-
    Charles II receives Bombay as part of Catherine of Braganza's dowry (1661) and rents it to the
    Company for £10 a year.
  sources: [wp-bombay-presidency, isd-provinces]
  changes:
    eic: [bombay--bombay-suburban]
- date: "1690"
  certainty: confident
  note: Job Charnock settles at Sutanuti on the Hooghly, the start of Calcutta.
  sources: [wp-fort-william, isd-provinces]
  changes:
    eic: [bengal--calcutta]
- date: "1707-03"
  certainty: approximate
  note: >-
    Aurangzeb dies. The empire is at its greatest extent after the conquest of Bijapur and Golconda, but
    it is exhausted by 25 years of war against the Marathas.
  sources: [schwartzberg, wp-mughal]
  changes:
    mughal:
      - division:Hyderabad bombay--bijapur bombay--belgaum bombay--dharwar bombay--sholapur bombay--ahmednagar bombay--nasik
      - madras--north-arcot madras--south-arcot madras--nellore madras--cuddapah madras--kurnool madras--anantapur madras--bellary madras--chittoor
      - division:Central_Province_and_Berar|british -central-province-and-berar--akola -central-province-and-berar--amraoti -central-province-and-berar--buldana -central-province-and-berar--yeotmal
    maratha-peshwa: [bombay--poona, bombay--satara, bombay--ratnagiri, bombay--kolaba, bombay--thana]
- date: "1717"
  certainty: approximate
  note: >-
    Murshid Quli Khan, diwan and then governor of Bengal, runs the province with little reference to
    Delhi. Bengal, Bihar and Orissa begin to act as a separate state under nawabs at Murshidabad.
  sources: [schwartzberg, marshall-bengal]
