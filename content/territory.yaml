# British Raj territory, 1857–1947, as sets of base units (D6, D24).
# Selectors: unit id | division:<Division>[|british|princely|proxy] | -<unit id> to remove. Spaces in a
# division name are written as "_".
# Units outside present-day India are present-day district proxies (geoboundaries), so borders there
# are approximate.
- date: "1857"
  certainty: approximate
  note: >-
    On the eve of the revolt. Company territory has reached its greatest extent: Dalhousie has annexed
    Punjab (1849), Pegu (1852), Nagpur and Jhansi (by lapse, 1853–54) and Oudh (1856). The princely
    states cover about two-fifths of the subcontinent.
  sources: [schwartzberg, igi-atlas-1931, wp-presidencies, isd-1941, geoboundaries]
  assign:
    bengal-presidency:
      - division:Bengal|british
      - division:Bihar
      - orissa--balasore orissa--cuttack orissa--puri orissa--sambalpur
      - division:BGD:Barisal division:BGD:Chittagong division:BGD:Dhaka division:BGD:Khulna
      - division:BGD:Mymensingh division:BGD:Noakhali division:BGD:Rajshani division:BGD:Rangpur
      - division:BGD:Sylhet assam--sylhet
      - assam--goalpara assam--kamrup assam--darrang assam--nowgong assam--sibsagar assam--lakhimpur
      - assam--cachar assam--khasi-and-jaintia-hills
    madras-presidency: [division:Madras|british, orissa--ganjam, orissa--koraput]
    bombay-presidency:
      - division:Bombay|british
      - division:PAK:Sindh -pak--khairpur
    up:
      - >-
        division:United_Province|british -united-province--lucknow -united-province--unao
        -united-province--rae-bareli -united-province--sitapur -united-province--hardoi
        -united-province--kheri -united-province--fyzabad -united-province--gonda
