  changes:
    eic: [united-province--banda, united-province--hamirpur]
- date: "1816-03"
  certainty: confident
  note: Treaty of Sugauli after the Anglo-Nepalese War. Kumaon, Garhwal, Dehra Dun and the Simla hills are ceded.
  sources: [isd-provinces]
  changes:
    eic: [united-province--almora, united-province--garhwal, united-province--dehra-dun, himachal--shimla]
- date: "1818-06"
  certainty: confident
  note: >-
    The Third Anglo-Maratha War ends the Peshwa's rule. His lands become the core of the Bombay
