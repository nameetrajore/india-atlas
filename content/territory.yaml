- date: "1858-02"
  certainty: confident
  note: After its recapture, Delhi is moved from the North-Western Provinces to Punjab as punishment.
  sources: [wp-delhi-province, wp-punjab-province]
  changes:
    punjab: [delhi--delhi]
- date: "1861-11-02"
  certainty: approximate
  note: Nagpur Province and the Saugor and Nerbudda Territories are merged into the new Central Provinces.
  sources: [wp-cp]
  changes:
    central-provinces:
      - division:Central_Province_and_Berar|british -central-province-and-berar--akola
