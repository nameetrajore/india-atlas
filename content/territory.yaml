- date: "1751"
  certainty: approximate
  note: >-
    After ten years of Maratha raids, Alivardi Khan cedes Orissa to the Bhonsles and agrees to pay
    chauth (a tribute) for Bengal. Midnapore stays with Bengal.
  sources: [wp-maratha-bengal, marshall-bengal]
  changes:
    marathas-nagpur: [orissa--balasore, orissa--cuttack, orissa--puri]
- date: "1757-12"
  certainty: approximate
  note: >-
    After Plassey, Mir Jafar grants the Company the zamindari (the right to hold land and collect its
    revenue) of the 24 Parganas, south of Calcutta.
  sources: [wp-24-parganas, wp-plassey]
  changes:
    eic: [bengal--24-parganas]
- date: "1760-10"
  certainty: approximate
  note: >-
    Mir Qasim takes the throne and pays the Company with Burdwan, Midnapore and Chittagong. Chittagong
    is in present-day Bangladesh, and it is not yet in the base map.
  sources: [wp-mir-qasim, marshall-bengal]
  changes:
    eic: [bengal--burdwan, bengal--midnapore, division:BGD:Chittagong]
- date: "1765-08"
  certainty: approximate
  note: >-
    Treaty of Allahabad. Shah Alam II grants the Company the diwani of Bengal, Bihar and Orissa. Awadh
    gives Allahabad and Kora to the emperor. The Chingleput jagir is also shown, granted to the Company
    by the Nawab of Arcot in 1763.
  sources: [wp-allahabad, marshall-bengal]
  changes:
    eic-diwani:
      - bengal--bankura
      - bengal--birbhum
      - bengal--murshidabad
      - bengal--hooghly
      - bengal--howrah
      - bengal--nadia
      - bengal--dinajpur
      - bengal--malda
      - bengal--jalpaiguri
      - division:Bihar
      - division:BGD:Barisal division:BGD:Dhaka division:BGD:Khulna division:BGD:Mymensingh division:BGD:Noakhali division:BGD:Rajshani division:BGD:Rangpur division:BGD:Sylhet
    mughal: [united-province--allahabad, united-province--fatehpur]
    eic: [madras--chingleput]
- date: "1766"
  certainty: approximate
  note: The Northern Circars on the Coromandel coast are granted by the emperor (1765) and confirmed by the Nizam (1768).
  sources: [isd-provinces]
  changes:
    eic: [madras--vizagapatam, madras--godavari-east, madras--godavari-west, madras--kistna, orissa--ganjam]
- date: "1772"
  certainty: approximate
  note: >-
    Warren Hastings ends "dual government": the Company "stands forth as Diwan" and runs Bengal's
    revenue directly. The Nawab's government becomes a shell.
  sources: [marshall-bengal, isd-provinces]
  changes:
    eic:
      - bengal--bankura bengal--birbhum bengal--murshidabad bengal--hooghly bengal--howrah bengal--nadia
