- date: "1803"
  certainty: approximate
  note: >-
    In the Second Anglo-Maratha War, Wellesley's armies take Orissa, Delhi, Agra and the upper Doab. The
    Mughal emperor becomes a British pensioner in the Red Fort.
  sources: [isd-provinces]
  changes:
    eic:
      - orissa--balasore orissa--cuttack orissa--puri
      - united-province--agra united-province--muttra united-province--aligarh united-province--bulandshahr
