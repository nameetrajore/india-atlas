- date: "1774"
  certainty: approximate
  note: In the Rohilla War, Company troops help the Nawab of Awadh conquer Rohilkhand.
  sources: [wp-rohilkhand]
  changes:
    awadh: [united-province--bareilly, united-province--moradabad, united-province--budaun, united-province--shahjahanpur, united-province--pilibhit, united-province--bijnor]
- date: "1775"
  certainty: confident
  note: Awadh cedes Benares and its districts to the Company.
  sources: [isd-provinces]
  changes:
    eic: [united-province--benares, united-province--mirzapur, united-province--jaunpur, united-province--ghazipur, united-province--ballia]
- date: "1788"
  certainty: approximate
  note: Guntur, the last of the Northern Circars, is handed over by the Nizam.
  sources: [isd-provinces]
  changes:
    eic: [madras--guntur]
- date: "1792-03"
  certainty: confident
  note: Treaty of Seringapatam. Tipu Sultan loses half his kingdom, including Malabar and Salem, after the Third Anglo-Mysore War.
  sources: [isd-provinces]
  changes:
    eic: [madras--salem, madras--malabar]
- date: "1799-05"
  certainty: confident
  note: >-
    Tipu is killed at Seringapatam. Kanara, Coimbatore and Tanjore pass to the Company, and a Wodeyar
    boy is installed in a reduced Mysore under British protection.
  sources: [isd-provinces]
  changes:
    eic: [madras--south-kanara, bombay--kanara, madras--coimbatore, madras--nilgiris, madras--tanjore]
    sikh-empire: [division:PAK:Punjab, punjab--amritsar, punjab--gurdaspur]
- date: "1800"
  certainty: confident
  note: The Nizam cedes the "Ceded Districts" to pay for British troops, and Surat is taken over.
  sources: [isd-provinces]
  changes:
    eic: [madras--anantapur, madras--bellary, madras--cuddapah, bombay--surat]
- date: "1801"
  certainty: confident
  note: >-
    The Carnatic is annexed from its Nawab. Awadh is forced to cede half its territory, including Rohilkhand,
    Allahabad and the lower Doab, under its subsidiary treaty.
  sources: [isd-provinces]
