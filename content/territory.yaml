  certainty: confident
  note: Dalhousie applies the "doctrine of lapse" for the first time, annexing Satara when its ruler dies without a natural heir.
  sources: [isd-provinces]
  changes:
    eic: [bombay--satara]
- date: "1849-03"
  certainty: confident
  note: After the Second Anglo-Sikh War, Punjab is annexed. The Koh-i-Noor is taken.
  sources: [isd-provinces, wp-punjab-province]
  changes:
    eic:
      - division:PAK:Punjab -pak--bahawalpur -pak--bahawalnagar -pak--rahim-yar-khan
