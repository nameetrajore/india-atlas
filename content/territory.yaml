  certainty: confident
  note: The Company takes over the administration of Mysore, citing misrule.
  sources: [isd-provinces, wp-mysore-rendition]
  changes:
    mysore-commission: [division:Mysore]
- date: "1834"
  certainty: approximate
  note: Coorg is annexed and Peshawar falls to the Sikhs. Cachar and the Khasi-Jaintia hills follow in 1832–35.
  sources: [isd-provinces]
  changes:
    eic: [coorg--coorg, assam--cachar, assam--khasi-and-jaintia-hills, bengal--darjeeling]
    sikh-empire: [pak--peshawar, pak--kohat, pak--mardan, pak--charsadda, pak--nowshera, pak--swabi, pak--abbottabad, pak--haripur, pak--mansehra, pak--bannu, pak--dera-ismail-khan, pak--tank, pak--lakki-marwat, pak--karak, pak--hangu]
- date: "1839"
  certainty: confident
  note: Kurnool is annexed.
  sources: [isd-provinces]
  changes:
    eic: [madras--kurnool]
- date: "1843-03"
  certainty: confident
  note: >-
    Charles Napier conquers Sind without authorisation. The Company keeps it anyway, and it is attached
    to Bombay.
  sources: [isd-provinces]
  changes:
    eic: [division:PAK:Sindh -pak--khairpur]
- date: "1846-03"
  certainty: confident
  note: >-
    After the First Anglo-Sikh War the Jullundur Doab is taken. Kashmir is sold to Gulab Singh of Jammu
    for 7.5 million rupees (Treaty of Amritsar).
  sources: [isd-provinces]
  changes:
    eic: [punjab--jullundur, punjab--hoshiarpur, punjab--kangra, punjab--ambala, punjab--ferozepur, punjab--ludhiana]
