- date: "1724-10"
  certainty: approximate
  note: >-
    Nizam-ul-Mulk defeats the emperor's governor at Shakar Kheda and makes the Deccan his own, the
    start of Hyderabad State.
  sources: [wp-hyderabad]
  changes:
    hyderabad: [division:Hyderabad]
- date: "1737"
  certainty: approximate
  note: >-
    Under Peshwa Baji Rao I the Marathas take Malwa and much of Gujarat. In 1737 they raid the outskirts
