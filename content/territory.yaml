- date: "1856-02"
  certainty: confident
  note: >-
    Awadh is annexed for "misgovernment". The Nawab, Wajid Ali Shah, is exiled to Calcutta. Many of the
    Bengal Army's sepoys come from Awadh.
  sources: [isd-provinces, wp-oudh-province]
  changes:
    eic:
      - united-province--lucknow united-province--unao united-province--rae-bareli united-province--sitapur
      - united-province--hardoi united-province--kheri united-province--fyzabad united-province--gonda
      - united-province--bahraich united-province--sultanpur united-province--partabgarh united-province--bara-banki
- date: "1857-05"
  certainty: approximate
  note: >-
    On the eve of the revolt. Company territory has reached its greatest extent: Dalhousie has annexed
    Punjab (1849), Pegu (1852), Nagpur and Jhansi (by lapse, 1853–54) and Oudh (1856). The princely
    states cover about two-fifths of the subcontinent.
  sources: [schwartzberg, igi-atlas-1931, wp-presidencies, isd-1941, geoboundaries]
