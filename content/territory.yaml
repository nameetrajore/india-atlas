  certainty: confident
  note: >-
    Nagpur and Jhansi are annexed by lapse (1853–54), and Berar is "assigned" by the Nizam to pay for
    troops.
  sources: [isd-provinces, wp-lakshmibai]
  changes:
    eic:
      - central-province-and-berar--nagpur central-province-and-berar--wardha central-province-and-berar--bhandara
