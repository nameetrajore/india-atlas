# Places are first-class (D20). `name` = period name; `modern` = present-day name.
# `control` turns a place into a colonial foothold: each entry starts a new controller (a power or
# polity id) from `from` onwards.
# coords = [lng, lat]. `approx: true` = location known only roughly.
- id: calcutta
  name: Calcutta
  modern: Kolkata
  coords: [88.3420, 22.5726]
  tags: [port, fort, factory, capital]
  why: >-
    The Company's Bengal base. Siraj-ud-Daulah captured it in 1756 and renamed it Alinagar; Clive
    retook it in 1757. It later became the capital of British India (until 1911).
  control:
    - { from: "1690", power: eic }
    - { from: "1756-06-20", power: bengal-nawabs, note: "Captured by Siraj-ud-Daulah, renamed Alinagar" }
    - { from: "1757-01-02", power: eic, note: Retaken by Clive and Watson }
  sources: [wp-fort-william, wp-siege-calcutta]
- id: murshidabad
  name: Murshidabad
  modern: Murshidabad
  coords: [88.2700, 24.1800]
  tags: [capital]
  why: >-
    Capital of the Nawabs of Bengal. Siraj-ud-Daulah was executed here, and Clive installed Mir Jafar
    here.
  sources: [marshall-bengal]
- id: plassey
  name: Plassey
  modern: Palashi
  coords: [88.2500, 23.8000]
  tags: [battle]
  why: >-
    The site of the 1757 battle that gave the Company control over the Nawab of Bengal. It was decided
    more by defection than by fighting.
  sources: [wp-plassey]
- id: kasimbazar
  name: Kasimbazar
  modern: Cossimbazar
  coords: [88.2800, 24.1200]
  tags: [factory]
  why: >-
    A silk-trade centre beside Murshidabad, with Company, Dutch and French factories. Siraj-ud-Daulah
    seized the English factory in June 1756.
  control:
    - { from: "1658", power: eic }
    - { from: "1756-06", power: bengal-nawabs, note: Seized by Siraj-ud-Daulah }
    - { from: "1757-02", power: eic, note: Restored under the Treaty of Alinagar }
  sources: [marshall-bengal, wp-siraj]
- id: chandernagore
  name: Chandernagore
  modern: Chandannagar
  coords: [88.3700, 22.8700]
  tags: [port, factory]
  why: The French base in Bengal, captured by Clive and Watson in March 1757.
  control:
    - { from: "1688", power: french }
    - { from: "1757-03-23", power: eic, note: Captured by the British }
    - { from: "1765", power: french, approx: true, note: Restored after the Treaty of Paris (1763) }
  sources: [wp-chandannagar-town, wp-chandannagar]
- id: chinsurah
  name: Chinsurah
  modern: Chinsurah
  coords: [88.3900, 22.9000]
  tags: [port, factory]
  why: >-
    The Dutch base in Bengal. The British defeated a Dutch force nearby at Chinsurah (Bedara) in 1759.
  control:
    - { from: "1656", power: dutch }
  sources: [wp-chinsurah-town, wp-chinsurah]
- id: serampore
