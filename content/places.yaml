  coords: [80.7900, 26.8700]
  tags: [movement]
  why: Where HRA revolutionaries robbed a government train in 1925.
  sources: [wp-kakori]
- id: dandi
  name: Dandi
  modern: Dandi
  coords: [72.8020, 20.8880]
  tags: [movement]
  why: The end of the Salt March, where Gandhi picked up salt on 6 April 1930.
  sources: [wp-salt-march]
- id: dharasana
  name: Dharasana
  modern: Dharasana
  coords: [72.9300, 20.8300]
  tags: [movement]
  approx: true
  why: >-
    Salt works where non-violent volunteers were beaten in May 1930. Webb Miller's report reached the
