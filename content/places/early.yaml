# Places from the Company period (1600–1765).
- id: murshidabad
  name: Murshidabad
  modern: Murshidabad
  coords:
    - 88.27
    - 24.18
  tags:
    - capital
  why: Capital of the Nawabs of Bengal. Siraj-ud-Daulah was executed here, and Clive installed Mir Jafar here.
  sources:
    - marshall-bengal
- id: plassey
  name: Plassey
  modern: Palashi
  coords:
    - 88.25
    - 23.8
  tags:
    - battle
  why: The site of the 1757 battle that gave the Company control over the Nawab of Bengal. It was decided more
    by defection than by fighting.
  sources:
    - wp-plassey
- id: kasimbazar
  name: Kasimbazar
  modern: Cossimbazar
  coords:
    - 88.28
    - 24.12
  tags:
    - factory
  why: A silk-trade centre beside Murshidabad, with Company, Dutch and French factories. Siraj-ud-Daulah seized
    the English factory in June 1756.
  control:
    - from: "1658"
      power: eic
    - from: 1756-06
      power: bengal-nawabs
      note: Seized by Siraj-ud-Daulah
    - from: 1757-02
      power: eic
      note: Restored under the Treaty of Alinagar
  sources:
    - marshall-bengal
    - wp-siraj
